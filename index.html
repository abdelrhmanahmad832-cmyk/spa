<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر SpaShower</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background-color: #f4f4f9; 
            margin: 0; 
            padding: 20px; 
        }
        .product-card { 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            max-width: 400px; 
            margin: auto; 
        }
        h1 { color: #333; }
        .price { 
            color: #27ae60; 
            font-size: 24px; 
            font-weight: bold; 
        }
        button { 
            background: #3498db; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            font-size: 18px; 
            border-radius: 5px; 
            cursor: pointer; 
            margin-top: 15px; 
        }
        button:hover { background: #2980b9; }
        #message { 
            margin-top: 15px; 
            color: green; 
            display: none; 
        }
    </style>
</head>
<body>

    <div class="product-card">
        <h1>دش الاستحمام الذكي (SpaShower)</h1>
        <p>تجربة استحمام مريحة مع ضغط ماء مثالي وتوفير للاستهلاك.</p>
        <div class="price">15 دينار</div>
        <button onclick="buyProduct()">اطلب الآن</button>
        <p id="message">تم تسجيل الطلب بنجاح في متصفحك!</p>
    </div>

    <script>
        function buyProduct() {
            let orders = JSON.parse(localStorage.getItem('spa_orders')) || [];
            orders.push({ product: 'SpaShower', date: new Date().toLocaleString() });
            localStorage.setItem('spa_orders', JSON.stringify(orders));
            
            let msg = document.getElementById('message');
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 3000);
        }
    </script>
</body>
</html>
